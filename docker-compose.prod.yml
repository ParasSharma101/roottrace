services:
  postgres:
    image: postgres:16-alpine
    container_name: roottrace-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roottrace}
      POSTGRES_USER: ${POSTGRES_USER:-roottrace_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roottrace_app} -d ${POSTGRES_DB:-roottrace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-net

  redis:
    image: redis:7-alpine
    container_name: roottrace-redis-prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - data-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: roottrace-kafka-prod
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/roottrace/start-broker.sh"]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    secrets:
      - source: kafka_broker_config
        target: kafka-broker.properties
      - source: kafka_broker_key
        target: kafka-broker.p12
      - source: kafka_truststore
        target: kafka-truststore.p12
      - source: kafka_cluster_id
        target: kafka-cluster-id
      - source: kafka_broker_client
        target: kafka-broker-client.properties
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 --command-config /run/secrets/kafka-broker-client.properties >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
      - ./ops/kafka/start-broker.sh:/opt/roottrace/start-broker.sh:ro
    networks:
      - data-net

  kafka-bootstrap:
    image: apache/kafka:3.7.0
    entrypoint: ["/bin/bash", "/opt/roottrace/bootstrap-acls.sh"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    secrets:
      - source: kafka_admin_key
        target: kafka-admin.p12
      - source: kafka_admin_client
        target: kafka-admin.properties
      - source: kafka_truststore
        target: kafka-truststore.p12
    volumes:
      - ./ops/kafka/bootstrap-acls.sh:/opt/roottrace/bootstrap-acls.sh:ro
    networks:
      - data-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roottrace-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-roottrace}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-roottrace_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CONFIG_IMPORT: file:/run/secrets/kafka-backend-spring.properties
      SPRING_PROFILES_ACTIVE: prod
      ROOTTRACE_DEMO_ENABLED: "false"
      ROOTTRACE_JWT_SECRET: ${ROOTTRACE_JWT_SECRET:?Set ROOTTRACE_JWT_SECRET}
      ROOTTRACE_INGESTION_KEY: ${ROOTTRACE_INGESTION_KEY:?Set ROOTTRACE_INGESTION_KEY}
      ROOTTRACE_BREAKGLASS_ENABLED: "false"
      ROOTTRACE_MAIL_ENABLED: ${ROOTTRACE_MAIL_ENABLED:-false}
      ROOTTRACE_MAIL_FROM: ${ROOTTRACE_MAIL_FROM:-roottrace@localhost.invalid}
      ROOTTRACE_PUBLIC_APP_URL: ${ROOTTRACE_PUBLIC_APP_URL:-}
      ROOTTRACE_MAIL_ENCRYPTION_KEY: ${ROOTTRACE_MAIL_ENCRYPTION_KEY:-}
      ROOTTRACE_SMTP_HOST: ${ROOTTRACE_SMTP_HOST:-localhost}
      ROOTTRACE_SMTP_PORT: ${ROOTTRACE_SMTP_PORT:-587}
      ROOTTRACE_SMTP_USERNAME: ${ROOTTRACE_SMTP_USERNAME:-}
      ROOTTRACE_SMTP_PASSWORD: ${ROOTTRACE_SMTP_PASSWORD:-}
      ROOTTRACE_SMTP_AUTH: ${ROOTTRACE_SMTP_AUTH:-true}
      ROOTTRACE_SMTP_STARTTLS: ${ROOTTRACE_SMTP_STARTTLS:-true}
      ROOTTRACE_SMTP_SSL: ${ROOTTRACE_SMTP_SSL:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    secrets:
      - source: kafka_backend_key
        target: kafka-backend.p12
      - source: kafka_backend_spring
        target: kafka-backend-spring.properties
      - source: kafka_truststore
        target: kafka-truststore.p12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-bootstrap:
        condition: service_completed_successfully
    networks:
      - app-net
      - data-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8080
    container_name: roottrace-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true

secrets:
  kafka_broker_config:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/broker.properties
  kafka_broker_key:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/broker.p12
  kafka_broker_client:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/broker-client.properties
  kafka_truststore:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/truststore.p12
  kafka_cluster_id:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/cluster.id
  kafka_admin_key:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/admin.p12
  kafka_admin_client:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/admin.properties
  kafka_backend_key:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/backend.p12
  kafka_backend_spring:
    file: ${ROOTTRACE_KAFKA_SECRETS_DIR:-./.secrets/kafka}/backend-spring.properties

volumes:
  postgres_prod_data:
  redis_prod_data:
  kafka_prod_data:
