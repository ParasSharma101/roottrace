services:
  postgres:
    image: postgres:16-alpine
    container_name: roottrace-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roottrace}
      POSTGRES_USER: ${POSTGRES_USER:-roottrace_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roottrace_app} -d ${POSTGRES_DB:-roottrace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - roottrace-net

  redis:
    image: redis:7-alpine
    container_name: roottrace-redis-prod
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - roottrace-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: roottrace-kafka-prod
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_prod_data:/var/lib/kafka/data
    networks:
      - roottrace-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roottrace-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-roottrace}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-roottrace_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: prod
      ROOTTRACE_DEMO_ENABLED: "false"
      ROOTTRACE_JWT_SECRET: ${ROOTTRACE_JWT_SECRET:?Set ROOTTRACE_JWT_SECRET}
      ROOTTRACE_INGESTION_KEY: ${ROOTTRACE_INGESTION_KEY:?Set ROOTTRACE_INGESTION_KEY}
      ROOTTRACE_BREAKGLASS_ENABLED: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - roottrace-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roottrace-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1
    depends_on:
      - backend
    networks:
      - roottrace-net

networks:
  roottrace-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  kafka_prod_data:
