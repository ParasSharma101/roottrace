name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests, types, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    name: Backend integration tests and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
          cache: maven
      - name: Test and package with disposable infrastructure
        run: bash mvnw -B -ntp '-DargLine=-Xmx1024m -Dspring.test.context.cache.maxSize=4' verify
      - name: Inventory resolved production dependencies
        run: bash mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DincludeTestScope=false
      - name: Scan packaged application dependencies
        run: |
          jq -e '[.components[]? | select(.purl | startswith("pkg:maven/"))] | length > 0' target/bom.json > /dev/null
          status=0
          docker run --rm -v "$PWD/target:/scan:ro" -v "$PWD/target:/reports" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb sbom /scan/bom.json \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json \
            --list-all-pkgs --timeout 15m --no-progress --output /reports/dependency-scan.json || status=$?
          jq -e '[.Results[]?.Packages[]?] | length > 0' target/dependency-scan.json > /dev/null
          exit "$status"
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/bom.json
            backend/target/dependency-scan.json
          retention-days: 7

  secrets:
    name: Tracked source secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan the current source tree without exposing findings
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo
          --redact --exit-code 1
