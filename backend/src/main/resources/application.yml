server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: roottrace-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:roottrace}
    username: ${POSTGRES_USER:roottrace_app}
    password: ${POSTGRES_PASSWORD:roottrace_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: RootTraceHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: roottrace-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

github:
  token: ${GITHUB_TOKEN:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

roottrace:
  demo:
    enabled: ${ROOTTRACE_DEMO_ENABLED:false}
  security:
    jwt:
      secret: ${ROOTTRACE_JWT_SECRET:}
      expiration-ms: ${ROOTTRACE_JWT_EXPIRATION_MS:86400000}
    ingestion:
      api-key: ${ROOTTRACE_INGESTION_KEY:}
    break-glass:
      enabled: ${ROOTTRACE_BREAKGLASS_ENABLED:false}
      token: ${ROOTTRACE_BREAKGLASS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
